<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تعيين كلمة مرور جديدة — بيتزا بيتلوز</title>
<script src="https://esm.sh/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; background:#F5F5F5; margin:0; padding:24px; direction:rtl; }
  .card { max-width:420px; margin:40px auto; background:#fff; border-radius:16px; padding:28px; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  h1 { color:#3A8E15; font-size:20px; margin-top:0; }
  input { width:100%; box-sizing:border-box; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; font-size:15px; }
  button { width:100%; padding:14px; background:#6EBE45; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
  button:disabled { background:#ccc; }
  #msg { margin-top:12px; font-size:14px; }
  .error { color:#c62828; }
  .success { color:#2e7d32; }
</style>
</head>
<body>
  <div class="card">
    <h1>تعيين كلمة مرور جديدة</h1>
    <p>أدخل كلمة المرور الجديدة لحسابك في بيتزا بيتلوز.</p>
    <input id="password" type="password" placeholder="كلمة المرور الجديدة (٦ أحرف على الأقل)" />
    <button id="submitBtn">تحديث كلمة المرور</button>
    <div id="msg"></div>
  </div>
  <script>
    // ⚠️ نسخة DEV فقط — Supabase URL/Anon Key هنا مضبوطان صراحةً على مشروع
    // pizza-bitluz-dev (نفس القيم في supabase_config.dart، آمنة تمامًا،
    // Client-safe بالتصميم). نسخة PROD منفصلة بقيم مختلفة (راجع
    // reset-password-prod.html).
    const supabaseClient = window.supabase.createClient(
      'https://gtvlxkqwbgshemyqfxzi.supabase.co',
      'sb_publishable_PSG6Bs6XyYgzrIhB8HNxFw_-IPCLTWv'
    );
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    // ✅ Supabase قد يُنتج رابط استرجاع بصيغة PKCE (?code=...) أو بالصيغة
    // الكلاسيكية (Fragment: #access_token=...&refresh_token=...) حسب إعداد
    // Auth Flow لهذا المشروع تحديدًا — نتعامل مع الحالتين معًا بدل افتراض
    // واحدة فقط، لتعمل الصفحة بصرف النظر عن الإعداد الفعلي.
    async function establishSessionFromUrl() {
      const queryParams = new URLSearchParams(window.location.search);
      const code = queryParams.get('code');
      if (code) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) {
          msgEl.innerHTML = '<span class="error">الرابط غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا من التطبيق.</span>';
          btn.disabled = true;
        }
        return;
      }

      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      if (!accessToken || !refreshToken) {
        msgEl.innerHTML = '<span class="error">الرابط غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا من التطبيق.</span>';
        btn.disabled = true;
        return;
      }
      const { error } = await supabaseClient.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken,
      });
      if (error) {
        msgEl.innerHTML = '<span class="error">الرابط غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا من التطبيق.</span>';
        btn.disabled = true;
      }
    }

    btn.addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      if (!password || password.length < 6) {
        msgEl.innerHTML = '<span class="error">كلمة المرور يجب أن تكون ٦ أحرف على الأقل.</span>';
        return;
      }
      btn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        msgEl.innerHTML = '<span class="error">تعذّر تحديث كلمة المرور. حاول مرة أخرى أو اطلب رابطًا جديدًا.</span>';
        btn.disabled = false;
        return;
      }
      msgEl.innerHTML = '<span class="success">تم تحديث كلمة المرور بنجاح. يمكنك الآن العودة لتطبيق بيتزا بيتلوز وتسجيل الدخول برقمك وكلمة المرور الجديدة.</span>';
    });

    establishSessionFromUrl();
  </script>
</body>
</html>
